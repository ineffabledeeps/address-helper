<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 280px; font-family: Arial, sans-serif; padding: 12px; margin: 0; box-sizing: border-box; }
    select, button { width: 100%; padding: 8px; margin-bottom: 8px; box-sizing: border-box; }
    button { background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;}
    button:hover { background-color: #218838; }
    .action-btn { background-color: #007bff; }
    .action-btn:hover { background-color: #0056b3; }
    hr { border: 0; border-top: 1px solid #ccc; margin: 8px 0 12px 0; }
    #status { font-size: 12px; text-align: center; font-weight: bold; margin-top: 5px; }
  </style>
</head>
<body>
  <h2>Address Helper</h2>
  
  <!-- New Trigger Button -->
  <button id="openSidebarBtn" class="action-btn">🔍 Open Search Sidebar</button>
  
  <hr>

  <label for="profileSelect"><b>Select Saved Booking Profile:</b></label>
  <select id="profileSelect">
    <option value="">-- Loading profiles... --</option>
  </select>
  
  <button id="fillBtn">Autofill Selection</button>
  <div id="status"></div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
